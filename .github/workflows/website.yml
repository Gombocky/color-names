# Builds the project website (website/, which lives only on this branch)
# and publishes it to GitHub Pages. Before building it takes in main, so
# the "date added" data is read from the list's latest history.

name: Website

on:
  push:
    branches: [project-website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # added.mjs reads the whole history of the list
      - name: Take in main's latest list
        run: |
          git fetch origin main
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
